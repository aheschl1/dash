server {
    listen 80;
    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket for the agent. More specific than /api/ so it wins the
    # longest-prefix match; needs HTTP/1.1 + the Upgrade headers (the plain
    # /api/ block below is HTTP/1.0 and would break the handshake). The outer
    # server-nginx already forwards upgrades, so this is the only inner change.
    location /api/ws/ {
        proxy_pass http://127.0.0.1:8000/api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # FastAPI auto-generated API docs live at the backend root, not under /api/.
    # Expose them explicitly so they aren't swallowed by the SPA fallback above.
    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location = /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
    }

    location = /redoc {
        proxy_pass http://127.0.0.1:8000/redoc;
        proxy_set_header Host $host;
    }
}
